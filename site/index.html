<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="utf-8">
		<title>Example Frontend Yay</title>
		<link rel="stylesheet" href="style.css" type="text/css" media="all">
	</head>
	<body>
		<center>
		<h1>Very Evil Frontend</h1>		
		<div id="post">
			<form>
				<legend>Name</legend>
				<input type="text" name="username" id="username">
				<legend>Message</legend>
				<textarea name="message" id="message" rows="8" cols="40"></textarea>
				<br>
				<br>
				<button id="comment-button" type="button">Post</button>
			</form>
			
		</div>
		<hr>
		<h1>Very Evil Comment Section</h1>		
		</center>
		<div id="board">
		</div>
	</body>
	<script src="script.js"></script>
</html>
