<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Comment form · PUT /comment</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
			background: #f7f9fc;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			padding: 2rem 1.5rem;
		}

		.wrapper {
			max-width: 640px;
			width: 100%;
			display: flex;
			flex-direction: column;
			gap: 1.5rem;
		}

		.card {
			background: #ffffff;
			border-radius: 24px;
			box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
			padding: 2rem 2rem 2.25rem;
			border: 1px solid #eef2f6;
			transition: transform 0.2s ease;
		}
		.card:hover { transform: translateY(-2px); }

		h1 {
			font-size: 1.9rem;
			font-weight: 600;
			letter-spacing: -0.02em;
			color: #0b1c2e;
			display: flex;
			align-items: center;
			gap: 0.5rem;
			margin-bottom: 0.3rem;
			flex-wrap: wrap;
		}

		h2 {
			font-size: 1.25rem;
			font-weight: 600;
			color: #0b1c2e;
			letter-spacing: -0.01em;
			display: flex;
			align-items: center;
			gap: 0.5rem;
			margin-bottom: 0.4rem;
		}

		.endpoint-badge {
			background: #eef6ff;
			color: #1e5b9c;
			font-size: 0.8rem;
			font-weight: 500;
			padding: 0.2rem 0.65rem;
			border-radius: 30px;
			font-family: 'SF Mono', 'Fira Code', monospace;
			border: 1px solid #cfe3fc;
		}
		.endpoint-badge.get {
			background: #e6f4ea;
			color: #1e6b3b;
			border-color: #c3e6cd;
		}

		.subhead {
			font-size: 0.95rem;
			color: #5e6f8d;
			margin-bottom: 1.75rem;
			padding-bottom: 0.75rem;
			border-bottom: 1px solid #e9eef4;
		}

		.form-group { margin-bottom: 1.35rem; }

		label {
			display: block;
			font-size: 0.9rem;
			font-weight: 500;
			color: #1e2c44;
			margin-bottom: 0.45rem;
		}
		label span { color: #b22234; margin-left: 0.15rem; }

		input, textarea {
			width: 100%;
			padding: 0.85rem 1rem;
			font-size: 1rem;
			font-family: inherit;
			background: #ffffff;
			border: 1.5px solid #dae1eb;
			border-radius: 16px;
			transition: border 0.15s ease, box-shadow 0.15s ease;
			outline: none;
			color: #0b1c2e;
		}
		input:focus, textarea:focus {
			border-color: #3b7fc4;
			box-shadow: 0 0 0 3px rgba(59, 127, 196, 0.15);
		}
		input::placeholder, textarea::placeholder {
			color: #9aabbd;
		}
		textarea { min-height: 120px; resize: vertical; line-height: 1.5; }

		.form-actions {
			display: flex;
			align-items: center;
			gap: 1rem;
			margin-top: 1.75rem;
			flex-wrap: wrap;
		}

		button {
			background: #1a5c9e;
			color: white;
			font-weight: 600;
			font-size: 1rem;
			padding: 0.85rem 1.75rem;
			border: none;
			border-radius: 40px;
			cursor: pointer;
			transition: background 0.15s ease, transform 0.1s ease;
			box-shadow: 0 4px 8px rgba(26, 92, 158, 0.2);
			flex: 0 0 auto;
		}
		button:hover { background: #0f4a81; }
		button:active { transform: scale(0.97); }
		button:disabled {
			background: #a5bbd1;
			box-shadow: none;
			cursor: not-allowed;
			transform: none;
		}

		button.secondary {
			background: #eef6ff;
			color: #1a5c9e;
			box-shadow: none;
			border: 1px solid #cfe3fc;
			padding: 0.55rem 1.1rem;
			font-size: 0.85rem;
		}
		button.secondary:hover { background: #dbeafe; }

		.status {
			font-size: 0.9rem;
			padding: 0.6rem 1rem;
			border-radius: 60px;
			display: inline-flex;
			align-items: center;
			gap: 0.4rem;
			opacity: 0;
			visibility: hidden;
			transition: all 0.2s ease;
			max-width: 100%;
		}
		.status.visible {
			opacity: 1;
			visibility: visible;
		}
		.status.success { background: #e6f4ea; color: #1e6b3b; }
		.status.error   { background: #fdeaea; color: #b02a37; }
		.status.loading { background: #f0f5fc; color: #1a5c9e; }
		.status.success::before { content: "✓"; font-weight: 700; margin-right: 0.2rem; }
		.status.error::before   { content: "⚠️"; margin-right: 0.2rem; }

		.field-note {
			font-size: 0.75rem;
			color: #7e8fa8;
			margin-top: 0.25rem;
		}

		.response-preview {
			margin-top: 1.2rem;
			background: #f9fcff;
			border: 1px solid #e2ecf9;
			border-radius: 14px;
			padding: 0.75rem 1rem;
			font-size: 0.85rem;
			color: #2b4a6e;
			word-break: break-word;
			max-height: 180px;
			overflow-y: auto;
			display: none;
		}
		.response-preview.show { display: block; }
		.response-preview strong { font-weight: 600; color: #0f3b60; }
		.response-preview .err-code {
			display: inline-block;
			background: #ffe3e3;
			color: #b02a37;
			border-radius: 8px;
			padding: 0.1rem 0.5rem;
			font-family: 'SF Mono', 'Fira Code', monospace;
			font-size: 0.75rem;
			font-weight: 600;
			margin-right: 0.4rem;
		}
		.response-preview .ok-code {
			display: inline-block;
			background: #d9f0e0;
			color: #1e6b3b;
			border-radius: 8px;
			padding: 0.1rem 0.5rem;
			font-family: 'SF Mono', 'Fira Code', monospace;
			font-size: 0.75rem;
			font-weight: 600;
			margin-right: 0.4rem;
		}

		/* ---- Comment list styles ---- */
		.comments-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			flex-wrap: wrap;
			margin-bottom: 1.1rem;
		}

		.comment-count {
			background: #eef6ff;
			color: #1e5b9c;
			font-size: 0.8rem;
			font-weight: 600;
			padding: 0.2rem 0.6rem;
			border-radius: 30px;
			border: 1px solid #cfe3fc;
		}

		.comments-list {
			display: flex;
			flex-direction: column;
			gap: 0.85rem;
			max-height: 460px;
			overflow-y: auto;
			padding-right: 0.25rem;
		}

		.comment-item {
			background: #f9fcff;
			border: 1px solid #e2ecf9;
			border-radius: 16px;
			padding: 0.9rem 1.1rem;
			animation: fadeIn 0.25s ease;
		}

		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(4px); }
			to   { opacity: 1; transform: translateY(0); }
		}

		.comment-user {
			font-weight: 600;
			font-size: 0.92rem;
			color: #0f3b60;
			display: flex;
			align-items: center;
			gap: 0.4rem;
			margin-bottom: 0.35rem;
			word-break: break-word;
		}
		.comment-user::before {
			content: "👤";
			font-size: 0.85rem;
		}

		.comment-message {
			font-size: 0.95rem;
			color: #2b4a6e;
			line-height: 1.5;
			white-space: pre-wrap;
			word-break: break-word;
		}

		.empty-state {
			text-align: center;
			padding: 2.5rem 1rem;
			color: #7e8fa8;
			font-size: 0.95rem;
			background: #f9fcff;
			border: 1px dashed #d5e2f0;
			border-radius: 16px;
		}
		.empty-state .emoji { font-size: 2rem; display: block; margin-bottom: 0.5rem; }

		.list-status {
			font-size: 0.85rem;
			padding: 0.6rem 1rem;
			border-radius: 12px;
			display: none;
			margin-bottom: 1rem;
		}
		.list-status.show { display: block; }
		.list-status.error { background: #fdeaea; color: #b02a37; }
		.list-status.loading { background: #f0f5fc; color: #1a5c9e; }

		.skeleton {
			background: linear-gradient(90deg, #eef2f6 25%, #e2e9f1 50%, #eef2f6 75%);
			background-size: 200% 100%;
			animation: shimmer 1.2s infinite;
			border-radius: 16px;
			height: 72px;
		}
		@keyframes shimmer {
			0%   { background-position: 200% 0; }
			100% { background-position: -200% 0; }
		}

		@media (max-width: 480px) {
			.card { padding: 1.5rem; }
			h1 { font-size: 1.6rem; }
			h2 { font-size: 1.15rem; }
			button, .status { width: 100%; justify-content: center; }
		}
	</style>
</head>
<body>

<div class="wrapper">

	<!-- ============ SUBMIT COMMENT CARD ============ -->
	<div class="card">
		<h1>
			💬 Comment
			<span class="endpoint-badge">PUT /comment</span>
		</h1>
		<div class="subhead">
			Submit via API — sends a <code>PUT</code> request with a
			<code>application/x-www-form-urlencoded</code> body.
		</div>

		<form id="commentForm" novalidate>
			<div class="form-group">
				<label for="username">Username <span>*</span></label>
				<input
					type="text"
					id="username"
					name="username"
					placeholder="e.g. jane_doe"
					autocomplete="username"
					required
					minlength="2"
					maxlength="40"
				>
				<div class="field-note">2–40 characters</div>
			</div>

			<div class="form-group">
				<label for="message">Message <span>*</span></label>
				<textarea
					id="message"
					name="message"
					placeholder="Write your comment here…"
					required
					minlength="4"
					maxlength="800"
				></textarea>
				<div class="field-note">4–800 characters</div>
			</div>

			<div class="form-actions">
				<button type="submit" id="submitBtn">Submit comment</button>
				<div id="status" class="status"></div>
			</div>
		</form>

		<div id="responsePreview" class="response-preview"></div>
	</div>

	<!-- ============ COMMENTS LIST CARD ============ -->
	<div class="card">
		<div class="comments-header">
			<h2>
				📋 Comments
				<span class="endpoint-badge get">GET /fetch</span>
				<span id="commentCount" class="comment-count" style="display:none;">0</span>
			</h2>
			<button type="button" id="refreshBtn" class="secondary">↻ Refresh</button>
		</div>

		<div id="listStatus" class="list-status"></div>
		<div id="commentsList" class="comments-list"></div>
	</div>

</div>

<script>
	(function () {
		// ============ SUBMIT FORM LOGIC ============
		const form = document.getElementById('commentForm');
		const usernameInput = document.getElementById('username');
		const messageInput = document.getElementById('message');
		const submitBtn = document.getElementById('submitBtn');
		const statusDiv = document.getElementById('status');
		const responsePreview = document.getElementById('responsePreview');

		const API_ENDPOINT = '/comment';

		function showStatus(message, type = 'loading', timeout = 0) {
			statusDiv.textContent = message;
			statusDiv.className = `status visible ${type}`;
			if (timeout > 0 && type !== 'loading') {
				setTimeout(() => {
					if (statusDiv.classList.contains(type)) {
						statusDiv.classList.remove('visible', 'success', 'error', 'loading');
						statusDiv.textContent = '';
					}
				}, timeout);
			}
		}
		function hideStatus() {
			statusDiv.classList.remove('visible', 'success', 'error', 'loading');
			statusDiv.textContent = '';
		}
		function escapeHtml(text) {
			if (typeof text !== 'string') {
				try { text = JSON.stringify(text, null, 2); }
				catch (e) { text = String(text); }
			}
			const div = document.createElement('div');
			div.textContent = text;
			return div.innerHTML;
		}
		function showResponsePreview(html, isError = false) {
			responsePreview.classList.add('show');
			responsePreview.innerHTML = html;
			responsePreview.style.borderColor = isError ? '#f5c2c7' : '#e2ecf9';
		}
		function clearResponsePreview() {
			responsePreview.classList.remove('show');
			responsePreview.innerHTML = '';
			responsePreview.style.borderColor = '#e2ecf9';
		}
		function resetSubmitState() {
			submitBtn.disabled = false;
			submitBtn.textContent = 'Submit comment';
		}

		function validateForm() {
			const username = usernameInput.value.trim();
			const message = messageInput.value.trim();

			if (!username) {
				showStatus('Please enter a username.', 'error', 5000);
				usernameInput.focus();
				return false;
			}
			if (username.length < 2 || username.length > 40) {
				showStatus('Username must be 2–40 characters.', 'error', 5000);
				usernameInput.focus();
				return false;
			}
			if (!message) {
				showStatus('Please enter a message.', 'error', 5000);
				messageInput.focus();
				return false;
			}
			if (message.length < 4 || message.length > 800) {
				showStatus('Message must be 4–800 characters.', 'error', 5000);
				messageInput.focus();
				return false;
			}
			return true;
		}

		function extractErrorMessage(data, status) {
			if (data == null) return `HTTP ${status}`;
			if (typeof data === 'string') return data || `HTTP ${status}`;
			if (typeof data === 'object') {
				return data.message || data.error || data.detail || JSON.stringify(data);
			}
			return String(data);
		}

		// Server contract for PUT /comment:
		//   - MethodNotAllowed → method is not PUT		  (HTTP 405)
		//   - BadRequest	   → cannot parse form body	  (HTTP 400)
		//   - Forbidden		→ could not save the message  (HTTP 505)
		function describeFailure(status, errorName, rawMessage) {
			const name = (errorName || '').toString().toLowerCase();

			if (name.includes('methodnotallowed') || status === 405) {
				return {
					key: 'MethodNotAllowed',
					title: 'Method Not Allowed',
					detail: 'The server rejected the request method. Only PUT is accepted for /comment.'
				};
			}
			if (name.includes('badrequest') || status === 400) {
				return {
					key: 'BadRequest',
					title: 'Bad Request',
					detail: 'The server could not parse the form data. A valid form-encoded body (username + message) is required.'
				};
			}
			if (name.includes('forbidden') || status === 505) {
				return {
					key: 'Forbidden',
					title: 'Forbidden',
					detail: 'The server could not save your message. This may be a permissions or storage issue.'
				};
			}
			if (status >= 500) {
				return {
					key: 'ServerError',
					title: 'Server Error',
					detail: rawMessage || 'An unexpected server error occurred.'
				};
			}
			return {
				key: 'Error',
				title: `Request Failed (HTTP ${status || '?'})`,
				detail: rawMessage || 'Unknown error.'
			};
		}

		async function sendComment() {
			const username = usernameInput.value.trim();
			const message = messageInput.value.trim();

			// application/x-www-form-urlencoded body
			const body = new URLSearchParams();
			body.append('username', username);
			body.append('message', message);

			submitBtn.disabled = true;
			submitBtn.textContent = 'Submitting…';
			hideStatus();
			clearResponsePreview();
			showStatus('Sending PUT request to /comment …', 'loading');

			let response, data = null, contentType = '';
			try {
				response = await fetch(API_ENDPOINT, {
					method: 'PUT',
					headers: {
						// Content-Type deliberately omitted → browser sets
						// application/x-www-form-urlencoded;charset=UTF-8 for URLSearchParams
						'Accept': 'application/json, text/plain, */*'
					},
					body: body
				});

				contentType = response.headers.get('content-type') || '';
				if (contentType.includes('application/json')) {
					try { data = await response.json(); }
					catch { data = await response.text(); }
				} else {
					data = await response.text();
				}
			} catch (networkErr) {
				console.error('Network error:', networkErr);
				showStatus('Network error – could not reach the server.', 'error');
				showResponsePreview(
					`<strong>⚠️ Network error:</strong> ${escapeHtml(networkErr.message || 'Failed to reach server')}`,
					true
				);
				resetSubmitState();
				return;
			}

			if (response.ok) {
				const successMsg = (data && (data.message || data.id)) ||
								   (typeof data === 'string' ? data : 'Comment saved.');
				showStatus('Comment submitted successfully!', 'success', 6000);
				showResponsePreview(
					`<span class="ok-code">HTTP ${response.status}</span>${escapeHtml(String(successMsg))}`,
					false
				);
				resetSubmitState();
				// Auto-refresh the comment list after a successful submit
				loadComments();
				return;
			}

			// Failure path
			let errorName = '';
			if (data && typeof data === 'object') {
				errorName = data.error || data.name || data.type || '';
			}
			const rawMessage = extractErrorMessage(data, response.status);
			const info = describeFailure(response.status, errorName, rawMessage);

			console.warn(`PUT /comment failed: ${info.key}`, { status: response.status, data });

			let statusText;
			switch (info.key) {
				case 'MethodNotAllowed':
					statusText = '405 Method Not Allowed — endpoint only accepts PUT.';
					break;
				case 'BadRequest':
					statusText = '400 Bad Request — server could not parse the form.';
					break;
				case 'Forbidden':
					statusText = '505 Forbidden — server could not save the message.';
					break;
				default:
					statusText = `${response.status} — ${info.title}: ${rawMessage}`;
			}
			showStatus(statusText, 'error', 8000);

			showResponsePreview(
				`<span class="err-code">HTTP ${response.status}</span>` +
				`<strong>${escapeHtml(info.title)}</strong><br>` +
				`<span>${escapeHtml(info.detail)}</span>` +
				(rawMessage && rawMessage !== info.detail
					? `<br><small style="color:#7e8fa8">Server said: ${escapeHtml(rawMessage)}</small>`
					: ''),
				true
			);

			resetSubmitState();
		}

		form.addEventListener('submit', function (e) {
			e.preventDefault();
			if (!validateForm()) return;
			sendComment();
		});

		[usernameInput, messageInput].forEach(el => {
			el.addEventListener('input', () => {
				if (statusDiv.classList.contains('error')) hideStatus();
			});
		});

		clearResponsePreview();

		// ============ COMMENT LIST LOGIC (GET /fetch) ============
		const FETCH_ENDPOINT = '/fetch';
		const commentsList = document.getElementById('commentsList');
		const listStatus = document.getElementById('listStatus');
		const commentCount = document.getElementById('commentCount');
		const refreshBtn = document.getElementById('refreshBtn');

		function setListStatus(message, type) {
			if (!message) {
				listStatus.className = 'list-status';
				listStatus.textContent = '';
				return;
			}
			listStatus.className = `list-status show ${type}`;
			listStatus.textContent = message;
		}

		function renderSkeletons() {
			commentsList.innerHTML = '';
			for (let i = 0; i < 3; i++) {
				const sk = document.createElement('div');
				sk.className = 'skeleton';
				commentsList.appendChild(sk);
			}
		}

		function renderEmptyState() {
			commentsList.innerHTML = `
				<div class="empty-state">
					<span class="emoji">💭</span>
					No comments yet. Be the first to post one!
				</div>`;
			commentCount.style.display = 'none';
		}

		function renderComments(comments) {
			commentsList.innerHTML = '';

			if (!Array.isArray(comments) || comments.length === 0) {
				renderEmptyState();
				return;
			}

			commentCount.style.display = 'inline-block';
			commentCount.textContent = comments.length;

			const frag = document.createDocumentFragment();
			comments.forEach(c => {
				if (!c || typeof c !== 'object') return;
				const item = document.createElement('div');
				item.className = 'comment-item';

				const user = document.createElement('div');
				user.className = 'comment-user';
				user.textContent = c.username ?? '(anonymous)';

				const msg = document.createElement('div');
				msg.className = 'comment-message';
				msg.textContent = c.message ?? '';

				item.appendChild(user);
				item.appendChild(msg);
				frag.appendChild(item);
			});
			commentsList.appendChild(frag);
		}

		async function loadComments() {
			// Show loading state (skeletons only if list is empty)
			if (commentsList.children.length === 0) {
				renderSkeletons();
			}
			setListStatus('Loading comments…', 'loading');
			refreshBtn.disabled = true;
			refreshBtn.textContent = 'Loading…';

			let response, data;
			try {
				response = await fetch(FETCH_ENDPOINT, {
					method: 'GET',
					headers: { 'Accept': 'application/json' }
				});
			} catch (networkErr) {
				console.error('GET /fetch network error:', networkErr);
				setListStatus('Network error – could not load comments.', 'error');
				if (commentsList.querySelectorAll('.skeleton').length) {
					renderEmptyState();
				}
				refreshBtn.disabled = false;
				refreshBtn.textContent = '↻ Refresh';
				return;
			}

			try {
				const contentType = response.headers.get('content-type') || '';
				if (contentType.includes('application/json')) {
					data = await response.json();
				} else {
					// Try JSON anyway, fallback to text
					const text = await response.text();
					try { data = JSON.parse(text); }
					catch { data = text; }
				}
			} catch (parseErr) {
				console.error('GET /fetch parse error:', parseErr);
				setListStatus('Server returned an unreadable response.', 'error');
				renderEmptyState();
				refreshBtn.disabled = false;
				refreshBtn.textContent = '↻ Refresh';
				return;
			}

			if (!response.ok) {
				const msg = extractErrorMessage(data, response.status);
				setListStatus(`Could not load comments (HTTP ${response.status}): ${msg}`, 'error');
				if (commentsList.querySelectorAll('.skeleton').length) {
					renderEmptyState();
				}
				refreshBtn.disabled = false;
				refreshBtn.textContent = '↻ Refresh';
				return;
			}

			// Validate shape: must be an array
			if (!Array.isArray(data)) {
				setListStatus('Unexpected response format (expected a JSON array).', 'error');
				renderEmptyState();
				refreshBtn.disabled = false;
				refreshBtn.textContent = '↻ Refresh';
				return;
			}

			setListStatus('', null);
			renderComments(data);
			refreshBtn.disabled = false;
			refreshBtn.textContent = '↻ Refresh';
		}

		refreshBtn.addEventListener('click', loadComments);

		// Initial load
		loadComments();
	})();
</script>
</body>
</html>
